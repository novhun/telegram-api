<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep space cyber gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <!-- Futuristic cyber blue/cyan glowing gradient for plane -->
    <linearGradient id="plane-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088cc" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <!-- Soft shadow glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with slight rounded maskable square look -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" />
  <!-- Glowing subtle circular rings in background -->
  <circle cx="256" cy="256" r="180" stroke="rgba(0, 212, 255, 0.08)" stroke-width="2" fill="none" />
  <circle cx="256" cy="256" r="220" stroke="rgba(0, 212, 255, 0.04)" stroke-width="1" stroke-dasharray="10 10" fill="none" />
  <!-- Stylized glowing Paper Plane -->
  <g filter="url(#glow)" transform="translate(4, -4)">
    <path d="M120 250 L380 140 L280 340 L240 280 Z" fill="url(#plane-grad)" />
    <path d="M380 140 L240 280 L280 290 Z" fill="rgba(255,255,255,0.25)" />
    <path d="M240 280 L220 340 L256 300 Z" fill="#0088cc" opacity="0.8" />
  </g>
</svg>
